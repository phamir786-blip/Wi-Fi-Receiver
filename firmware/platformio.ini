; PlatformIO Project Configuration File for WiFi-HiFi ESP32-C3 Receiver
; Target: ESP32-C3 RISC-V (4MB Flash, No PSRAM)
; DAC: NXP UDA1334A via I2S

[platformio]
default_envs = esp32c3
src_dir = src
include_dir = include

[env:esp32c3]
platform = espressif32 @ 6.9.0
board = esp32-c3-devkitm-1
framework = arduino

; Serial Monitor & Upload Settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, default
upload_speed = 460800

; Partition table supporting Dual OTA (1.5MB app0 + 1.5MB app1)
board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 160000000L

; Build flags: ESP32-C3 RISC-V optimization, Buffer sizing, AsyncWeb / ArduinoJson
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_NO_PSRAM
    -D WIFI_HIFI_FIRMWARE_VERSION=\"1.0.0\"
    -D WIFI_HIFI_DEVICE_NAME=\"WiFi-HiFi\"
    -D WIFI_HIFI_HOSTNAME=\"wifi-hifi\"
    -O2

; Post-build script to automatically generate merged 0x0 flashable binary
extra_scripts = post:scripts/merge_bin.py

; Clean, essential libraries for ESP32 Wi-Fi, mDNS, JSON REST API, and WebServer
; mathieucarbou/ESPAsyncWebServer automatically resolves and bundles its matched AsyncTCP
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    mathieucarbou/ESPAsyncWebServer @ ^3.3.23
